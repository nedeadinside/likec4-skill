name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate skill
        run: likec4-skill/scripts/check.sh

      # snippet-fixtures.md is test scaffolding for check-snippets.sh — it has
      # no meaning outside this repo, so it does not ship to users.
      - name: Build zip
        run: zip -r likec4-skill.zip likec4-skill -x 'likec4-skill/scripts/snippet-fixtures.md'

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" likec4-skill.zip --generate-notes
