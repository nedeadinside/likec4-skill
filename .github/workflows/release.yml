name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate templates
        run: likec4-skill/scripts/check.sh

      - name: Build zip
        run: zip -r likec4-skill.zip likec4-skill

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" likec4-skill.zip --generate-notes
