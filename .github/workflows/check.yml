name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Templates compile and are canonical, every ```likec4 block in the docs
      # compiles, and every block marked `invalid` still fails.
      - name: Validate skill
        run: likec4-skill/scripts/check.sh
